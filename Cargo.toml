[package]
name = "emi"
version = "2.0.1"
edition = "2024"
description = "Deterministic behavioral verification and hillclimbing CLI for agentic software"
repository = "https://github.com/andrejksi/emiv2"
license = "MIT"
keywords = ["testing", "differential-testing", "simulation", "agents", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "emi"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
